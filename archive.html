  <style>
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 140px;
      gap: 1.5rem;
      padding: 2rem 0 4rem;
      max-width: 100%;
    }
    .archive-block {
      border-radius: 4px;
      overflow: hidden;
      min-height: 140px;
      transition: transform 0.2s ease;
    }
    .archive-block:hover {
      transform: scale(1.02);
    }
    .archive-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Place 3 images with gaps – no placeholder blocks */
    .archive-block:nth-child(1) { grid-column: 1 / 3; grid-row: 1 / 3; }
    .archive-block:nth-child(2) { grid-column: 4 / 5; grid-row: 1 / 2; }
    .archive-block:nth-child(3) { grid-column: 3 / 5; grid-row: 3 / 4; }
    @media screen and (max-width: 768px) {
      .archive-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 100px;
        gap: 1rem;
        padding: 1.5rem 0 3rem;
      }
      .archive-block {
        min-height: 100px;
      }
      .archive-block:nth-child(1) { grid-column: 1 / 3; grid-row: 1 / 3; }
      .archive-block:nth-child(2) { grid-column: 3 / 4; grid-row: 1 / 2; }
      .archive-block:nth-child(3) { grid-column: 1 / 3; grid-row: 4 / 5; }
    }
  </style>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
